name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Node.js environment
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20
        
    - name: Install Node.js modules
      run: npm install

    - name: Install VSCE
      run: npm install -g @vscode/vsce

    - name: Lint
      run: npm run tslint

    - name: Build OSGi bundle
      run: npm run build-server

    - name: Build VSIX file
      run: vsce package

    - name: Test extension
      run: npm test

    - name: Print language server Log if job failed
      if: ${{ failure() }}
      run: |
        if (-not $env:JAVA_TEST_USER_DIR -or -not (Test-Path "$env:JAVA_TEST_USER_DIR\User\workspaceStorage")) {
          Write-Warning 'Java test workspace storage is unavailable; the test host may not have started.'
          exit 0
        }
        Get-ChildItem -Path "$env:JAVA_TEST_USER_DIR\User\workspaceStorage\*\redhat.java\jdt_ws\.metadata\.log" -Force |
          ForEach-Object { Write-Output $_.FullName; Get-Content -LiteralPath $_.FullName }

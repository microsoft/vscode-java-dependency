name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbfile-dev pkg-config libsecret-1-dev libxss1 dbus xvfb libgtk-3-0 libgbm1
        sudo /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 3

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Node.js environment
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20
        
    - name: Install Node.js modules
      run: npm install

    - name: Install VSCE
      run: npm install -g @vscode/vsce

    - name: Build OSGi bundle
      run: npm run build-server

    - name: Build VSIX file
      run: vsce package

    - name: Test extension
      run: DISPLAY=:99 npm test

    - name: Print language server Log if job failed
      if: ${{ failure() }}
      run: |
        if [ -z "$JAVA_TEST_USER_DIR" ] || [ ! -d "$JAVA_TEST_USER_DIR/User/workspaceStorage" ]; then
          echo "::warning::Java test workspace storage is unavailable; the test host may not have started."
          exit 0
        fi
        find "$JAVA_TEST_USER_DIR/User/workspaceStorage" -path '*/redhat.java/jdt_ws/.metadata/.log' -print -exec cat '{}' \;
# Test Plan: Java Dependency — Project Explorer
#
# Covers scenarios:
#   - javaProjectExplorer.focus shows Java Projects section
#   - linkWithFolderExplorer reveals active file in tree
#   - unlinkWithFolderExplorer stops auto-reveal
#   - revealInProjectExplorer reveals file from File Explorer context menu
#   - hideNonJavaResources removes workspace roots without Java projects
#
# Usage:
#   npx autotest run test/e2e-plans/java-dep-project-explorer.yaml --vsix <path-to-vsix>

name: "Java Dependency — Project Explorer"
description: |
  Tests the Java Projects explorer view: focus, link/unlink with editor,
  reveal in project explorer, and filtering non-Java workspace roots.

setup:
  extension: "redhat.java"
  vscodeVersion: "stable"
  workspace: "../maven"
  timeout: 180
  settings:
    java.configuration.checkProjectSettingsExclusions: false
    workbench.startupEditor: "none"

steps:
  # ── Wait for LS ready ──
  - id: "ls-ready"
    action: "waitForLanguageServer"
    # No `verify:` — `waitForLanguageServer` is itself the deterministic
    # readiness check. The AFTER screenshot may transiently show
    # "Java: Building - 0%" (Maven import starts immediately after Ready),
    # which a strict LLM mis-reads as a failure.
    timeout: 180

  # Free horizontal & vertical space so JAVA PROJECTS gets enough room.
  - id: "close-aux-bar"
    action: "executeVSCodeCommand workbench.action.closeAuxiliaryBar"
    verify: "Auxiliary bar (Chat) closed"

  - id: "collapse-outline"
    action: "collapseSidebarSection OUTLINE"

  - id: "collapse-timeline"
    action: "collapseSidebarSection TIMELINE"

  - id: "collapse-workspace-root"
    action: "collapseWorkspaceRoot"

  # ── Test 1: javaProjectExplorer.focus ──
  # The view is contributed to the Explorer container, so the palette title is
  # "Explorer: Focus on Java Projects View". Invoking the command id directly
  # via executeVSCodeCommand is locale-independent and slightly faster.
  - id: "focus-java-projects"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verify: "Java Projects view is focused"

  - id: "wait-tree-load"
    action: "wait 3 seconds"

  - id: "verify-project-node"
    action: "wait 1 seconds"
    # No `verify:` — state-check step; `verifyTreeItem` is authoritative.
    verifyTreeItem:
      name: "my-app"
    timeout: 15

  # ── Test 2: linkWithFolderExplorer ──
  # NOTE: action resolver only matches "expandTreeItem <name>" — strings like
  # "expand my-app tree item" silently fall back to command palette and no-op.
  - id: "expand-project"
    action: "expandTreeItem my-app"

  - id: "expand-src"
    action: "expandTreeItem src/main/java"
    waitBefore: 2

  - id: "verify-package"
    action: "wait 1 seconds"
    # No `verify:` — state-check step; `verifyTreeItem` is authoritative.
    verifyTreeItem:
      name: "com.mycompany.app"
    timeout: 15

  - id: "expand-package"
    action: "expandTreeItem com.mycompany.app"
    waitBefore: 2

  - id: "verify-app-class"
    action: "wait 1 seconds"
    # No `verify:` — state-check step; `verifyTreeItem` is authoritative.
    verifyTreeItem:
      name: "App"
      exact: true
    timeout: 15

  # ── Test 3: unlinkWithFolderExplorer ──
  # Click the title-bar action ("Unlink with Editor") in the JAVA PROJECTS pane.
  # When `config.java.dependency.syncWithFolderExplorer == true` (the default),
  # the package contributes the Unlink button to overflow_10@20 — clickViewTitleAction
  # locates it directly or via the "Views and More Actions..." overflow menu.
  - id: "unlink-editor"
    action: 'clickViewTitleAction "Java Projects" "Unlink with Editor"'
    # No `verify:` — toggling the link-with-editor setting produces no visible
    # change in the screenshot (tree selection persists from the prior reveal).
    # The behavior is verified deterministically by `wait-after-open` below:
    # after opening AppToRename.java, the tree must NOT auto-reveal it.

  - id: "open-rename-file"
    action: "open file AppToRename.java"

  - id: "wait-after-open"
    action: "wait 3 seconds"
    # Stability check: with link-with-editor disabled, opening
    # AppToRename.java must NOT change the Java Projects tree state. The
    # BEFORE and AFTER screenshots are expected to look identical (tree
    # state preserved), which is exactly what a comparison-only LLM
    # verification can confirm reliably. We cannot use verifyTreeItem
    # visible:false here because AppToRename is already visible (its
    # parent package was expanded by earlier setup steps); the check is
    # about tree-state stability, not item visibility.
    verify: "Java Projects tree state is unchanged; opening AppToRename.java did not auto-reveal or auto-select anything new."

  - id: "relink-editor"
    action: 'clickViewTitleAction "Java Projects" "Link with Editor"'
    # No `verify:` — same reason as `unlink-editor`. The behavior is verified
    # deterministically downstream when revealInProjectExplorer locates App.

  # ── Test 4: revealInProjectExplorer ──
  # Collapse all tree nodes, then reveal App.java by invoking the contributed
  # `java.view.package.revealInProjectExplorer` command. autotest 0.7.x has no
  # contextMenuOnEditorTab action, so we drive the command directly via
  # executeVSCodeCommand with a Uri-shaped POJO arg (the command reads
  # `uri.fsPath` and reconstructs a proper Uri before use, so a plain object
  # with `fsPath` is sufficient).
  - id: "collapse-all"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verify: "Collapse tree to reset state"

  - id: "open-app-file"
    action: "open file App.java"
    waitBefore: 2

  - id: "reveal-in-project-explorer"
    action: 'executeVSCodeCommand java.view.package.revealInProjectExplorer {"fsPath":"${workspaceFolder}/src/main/java/com/mycompany/app/App.java","scheme":"file"}'
    waitBefore: 2

  - id: "verify-revealed"
    action: "wait 2 seconds"
    # No `verify:` — state-check step; `verifyTreeItem` is authoritative.
    verifyTreeItem:
      name: "App"
      exact: true
    timeout: 15

  # ── Test 5: mixed multi-root project attribution (#1060) ──
  # First establish a mixed workspace and refresh it into WorkspaceNode roots.
  # The smoke-test driver renders folder pickers as an internal quick input:
  # entering an absolute folder path opens it, then the Add button confirms it.
  - id: "invoke-add-non-java-root"
    action: "executeVSCodeCommand workbench.action.addRootFolder"

  - id: "type-non-java-root"
    action: "fillQuickInput ${workspaceParent}/non-java"

  - id: "confirm-non-java-root"
    action: "tryClickButton Add"

  - id: "wait-non-java-root-ready"
    action: "waitForLanguageServer"
    timeout: 120
    skipLlmVerify: true

  - id: "refresh-mixed-workspace"
    action: "executeVSCodeCommand java.view.package.refresh"
    waitBefore: 2

  - id: "collapse-multi-root-explorer"
    action: "collapseSidebarSection UNTITLED (WORKSPACE)"

  - id: "focus-mixed-workspace"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    waitBefore: 2

  - id: "verify-non-java-workspace-root"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "non-java"
    timeout: 15

  # Hide Non-Java Resources now applies to the workspace-root level as well:
  # roots without any Java project disappear, while Java workspace roots remain.
  - id: "hide-non-java-workspace-root"
    action: 'clickViewTitleAction "Java Projects" "Hide Non-Java Resources"'

  - id: "wait-hide-non-java-workspace-root"
    action: "wait 5 seconds"

  - id: "verify-non-java-workspace-root-hidden"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "non-java"
      visible: false
      inView: "Java Projects"
    timeout: 30

  - id: "verify-java-workspace-root-remains"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "maven"
      inView: "Java Projects"
    timeout: 15

  - id: "restore-non-java-workspace-root"
    action: 'clickViewTitleAction "Java Projects" "Show Non-Java Resources"'

  - id: "wait-restore-non-java-workspace-root"
    action: "wait 5 seconds"

  - id: "verify-non-java-workspace-root-restored"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "non-java"
      inView: "Java Projects"
    timeout: 30

  # Add a Java folder after the mixed multi-root structure already exists and
  # refresh it into the expected WorkspaceNode -> ProjectNode hierarchy.
  - id: "invoke-add-java-root"
    action: "executeVSCodeCommand workbench.action.addRootFolder"

  - id: "type-java-root"
    action: "fillQuickInput ${workspaceParent}/simple"

  - id: "confirm-java-root"
    action: "tryClickButton Add"

  - id: "wait-java-root-ready"
    action: "waitForLanguageServer"
    timeout: 120
    skipLlmVerify: true

  - id: "refresh-added-java-root"
    action: "executeVSCodeCommand java.view.package.refresh"

  - id: "verify-java-workspace-root"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "simple"
      exact: true
      count: 1
      level: 1
    timeout: 15

  # Deterministically simulate the onDidProjectsImport path. Before #1060 this
  # command appended a second top-level ProjectNode named "simple" beside the
  # existing WorkspaceNode. The fixed provider ignores progressive insertion
  # in multi-root workspaces, so exactly one level-1 row remains.
  - id: "simulate-progressive-project-import"
    action: 'executeVSCodeCommand _java.view.package.internal.addProjects ["${workspaceParentUri}/simple"]'
    verifyTreeItem:
      name: "simple"
      exact: true
      count: 1
      level: 1
    timeout: 15

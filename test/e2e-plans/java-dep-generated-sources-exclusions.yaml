# Test Plan: Java Dependency - Generated Sources with an Excluded Ancestor
#
# AutoTest has no settings-update action, so a separate isolated profile supplies
# files.exclude. Exclusion transitions and explicit source-root exclusions are
# covered by test/generated-sources-suite/projectView.test.ts.

name: "Java Dependency - Generated Sources with an Excluded Ancestor"
description: |
  Excluding the physical target directory must retain the generated Java source
  root at project level with its original label. Switching back to GeneratedApp's
  editor tab must reveal it through link-with-editor in both flat and hierarchical
  package presentation.

setup:
  extension: "vscjava.vscode-java-pack"
  vscodeVersion: "stable"
  workspace: "../generated-sources"
  timeout: 180
  settings:
    java.configuration.checkProjectSettingsExclusions: false
    java.dependency.packagePresentation: "flat"
    java.dependency.syncWithFolderExplorer: true
    java.project.explorer.showNonJavaResources: true
    files.exclude:
      "**/target": true
    workbench.editor.enablePreview: false
    workbench.startupEditor: "none"

steps:
  - id: "ls-ready"
    action: "waitForLanguageServer"
    timeout: 180

  - id: "close-aux-bar"
    action: "executeVSCodeCommand workbench.action.closeAuxiliaryBar"

  - id: "collapse-outline"
    action: "collapseSidebarSection OUTLINE"

  - id: "collapse-timeline"
    action: "collapseSidebarSection TIMELINE"

  - id: "collapse-workspace-pane"
    action: "collapseSidebarSection generated-sources"

  - id: "focus-java-projects"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "generated-sources-tree"
      exact: true
      inView: "Java Projects"
    timeout: 30

  - id: "expand-project"
    action: "expandTreeItem generated-sources-tree"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "verify-excluded-target-hidden"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  # Open from the Java tree: Quick Open's file search also honors files.exclude.
  - id: "expand-logical-source-root"
    action: "expandTreeItem target/generated-sources/demo"
    verifyTreeItem:
      name: "com.example.generated"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "expand-generated-package"
    action: "expandTreeItem com.example.generated"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "open-generated-type"
    action: "doubleClick GeneratedApp tree item"
    verifyEditorTab:
      title: "GeneratedApp.java"
    timeout: 15

  # Keep GeneratedApp open, then activate pom.xml in the adjacent editor tab.
  # Switching back does not search the excluded directory through Quick Open.
  - id: "open-pom-before-flat-editor-link"
    action: "open file pom.xml"
    verifyEditorTab:
      title: "pom.xml"

  - id: "collapse-workspace-before-flat-editor-link"
    action: "collapseSidebarSection generated-sources"

  - id: "focus-java-projects-before-flat-editor-link"
    action: "executeVSCodeCommand javaProjectExplorer.focus"

  - id: "collapse-before-flat-editor-link"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "activate-generated-tab-in-flat-view"
    action: "executeVSCodeCommand workbench.action.previousEditor"
    verifyEditorTab:
      title: "GeneratedApp.java"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-flat-editor-link-retains-original-root-label"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "switch-to-hierarchical"
    action: "executeVSCodeCommand java.view.package.changeToHierarchicalPackageView"

  - id: "open-pom-before-hierarchical-editor-link"
    action: "open file pom.xml"
    verifyEditorTab:
      title: "pom.xml"

  - id: "collapse-workspace-before-hierarchical-editor-link"
    action: "collapseSidebarSection generated-sources"

  - id: "focus-java-projects-before-hierarchical-editor-link"
    action: "executeVSCodeCommand javaProjectExplorer.focus"

  - id: "collapse-before-hierarchical-editor-link"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "activate-generated-tab-in-hierarchical-view"
    action: "executeVSCodeCommand workbench.action.previousEditor"
    verifyEditorTab:
      title: "GeneratedApp.java"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-hierarchical-editor-link-retains-original-root-label"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "verify-hierarchical-target-stays-excluded"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "verify-no-shortened-source-root"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "demo"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

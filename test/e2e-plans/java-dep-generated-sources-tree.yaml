# Test Plan: Java Dependency — Generated Sources Tree
#
# Verifies that a generated Java source root under Maven's physical target
# directory is rendered as one merged hierarchy when non-Java resources are
# shown, while Hide keeps the Java source root available at the project level.
# Link-with-editor must reveal both layouts after changing package presentation.
#
# Usage:
#   npx autotest run test/e2e-plans/java-dep-generated-sources-tree.yaml --vsix <path-to-vsix>

name: "Java Dependency — Generated Sources Tree"
description: |
  Tests the merged Java Projects hierarchy for a physical Maven target folder
  containing a generated Java source root and ordinary build output, including
  link-with-editor after Show/Hide and flat/hierarchical presentation transitions,
  and Class/Package creation from the project node while its source root is merged.

setup:
  extension: "vscjava.vscode-java-pack"
  vscodeVersion: "stable"
  workspace: "../generated-sources"
  timeout: 180
  settings:
    java.configuration.checkProjectSettingsExclusions: false
    java.dependency.packagePresentation: "flat"
    java.project.explorer.showNonJavaResources: true
    files.exclude: {}
    workbench.startupEditor: "none"

steps:
  - id: "ls-ready"
    action: "waitForLanguageServer"
    timeout: 180

  - id: "close-aux-bar"
    action: "executeVSCodeCommand workbench.action.closeAuxiliaryBar"
    verify: "Auxiliary bar closed"

  - id: "collapse-outline"
    action: "collapseSidebarSection OUTLINE"

  - id: "collapse-timeline"
    action: "collapseSidebarSection TIMELINE"

  - id: "collapse-workspace-root"
    action: "collapseWorkspaceRoot"

  - id: "focus-java-projects"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verify: "Java Projects view is focused"

  - id: "wait-tree-load"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "generated-sources-tree"
      exact: true
      inView: "Java Projects"
    timeout: 30

  - id: "expand-project"
    action: "expandTreeItem generated-sources-tree"

  - id: "verify-single-target"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "verify-generated-root-not-duplicated"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  # Opening the generated Java file lets link-with-editor reveal the complete
  # merged hierarchy without an ambiguous "target" match in the File Explorer.
  - id: "open-generated-file"
    action: "open file GeneratedApp.java"
    waitBefore: 2
    verifyEditorTab:
      title: "GeneratedApp.java"

  - id: "collapse-workspace-root-after-generated-file"
    action: "collapseWorkspaceRoot"

  - id: "focus-java-projects-after-generated-file"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    waitBefore: 2

  - id: "verify-generated-sources-folder"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "generated-sources"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-nested-source-root"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "demo"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-generated-package"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "com.example.generated"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-generated-type"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  # Reveal an ordinary build file to prove the physical target resources remain
  # available alongside the generated Java source root.
  - id: "open-build-info"
    action: "open file build-info.txt"
    waitBefore: 2

  - id: "collapse-workspace-root-after-build-info"
    action: "collapseWorkspaceRoot"

  - id: "focus-java-projects-after-build-info"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    waitBefore: 2

  - id: "verify-build-info-visible"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "build-info.txt"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "hide-non-java-resources"
    action: "executeVSCodeCommand java.project.explorer.hideNonJavaResources"

  - id: "wait-hide-refresh"
    action: "wait 1 seconds"

  - id: "expand-project-after-hide"
    action: "expandTreeItem generated-sources-tree"

  - id: "verify-physical-target-hidden"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "verify-generated-root-kept"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "collapse-before-hidden-editor-link"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "open-generated-file-after-hide"
    action: "open file GeneratedApp.java"
    verifyEditorTab:
      title: "GeneratedApp.java"

  - id: "verify-linked-generated-file-after-hide"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-hidden-layout-keeps-original-root-label"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "show-non-java-resources"
    action: "executeVSCodeCommand java.project.explorer.showNonJavaResources"

  - id: "wait-show-refresh"
    action: "wait 1 seconds"

  # Activate another editor before collapsing, so reopening GeneratedApp must
  # trigger link-with-editor rather than leaving an already active tab unchanged.
  - id: "open-pom-before-show-editor-link"
    action: "open file pom.xml"
    verifyEditorTab:
      title: "pom.xml"

  - id: "reset-tree-after-show"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "expand-project-after-show"
    action: "expandTreeItem generated-sources-tree"

  - id: "verify-target-restored"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "verify-generated-root-merged-again"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "reopen-generated-file-after-show"
    action: "open file GeneratedApp.java"
    verifyEditorTab:
      title: "GeneratedApp.java"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "switch-to-hierarchical"
    action: "executeVSCodeCommand java.view.package.changeToHierarchicalPackageView"

  - id: "open-pom-before-hierarchical-editor-link"
    action: "open file pom.xml"
    verifyEditorTab:
      title: "pom.xml"

  - id: "collapse-hierarchical-tree"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  - id: "reopen-generated-file-in-hierarchical-view"
    action: "open file GeneratedApp.java"
    verifyEditorTab:
      title: "GeneratedApp.java"
    verifyTreeItem:
      name: "GeneratedApp"
      exact: true
      inView: "Java Projects"
    timeout: 15

  - id: "verify-hierarchical-view-retains-merged-root"
    action: "executeVSCodeCommand javaProjectExplorer.focus"
    verifyTreeItem:
      name: "demo"
      exact: true
      count: 1
      inView: "Java Projects"
    timeout: 15

  - id: "verify-hierarchical-view-does-not-duplicate-root"
    action: "wait 1 seconds"
    verifyTreeItem:
      name: "target/generated-sources/demo"
      exact: true
      visible: false
      inView: "Java Projects"
    timeout: 15

  # Show is still enabled. Use the project node's New... action, not a source
  # folder or URI, so creation must find the logical root hidden under target.
  - id: "save-before-project-class"
    action: "executeVSCodeCommand workbench.action.files.saveAll"

  - id: "close-editors-before-project-class"
    action: "executeVSCodeCommand workbench.action.closeAllEditors"

  - id: "collapse-workspace-before-project-class"
    action: "collapseWorkspaceRoot"

  - id: "collapse-tree-before-project-class"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"

  - id: "focus-tree-before-project-class"
    action: "executeVSCodeCommand javaProjectExplorer.focus"

  - id: "select-project-for-class"
    action: "click generated-sources-tree tree item"

  - id: "new-class-from-project"
    action: "clickTreeItemAction generated-sources-tree New..."

  - id: "select-project-class-type"
    action: "select Class option"

  # This fixture has only one source root, so no source-folder picker is shown.
  - id: "enter-project-class-name"
    action: "fillQuickInput ProjectCreatedClass"

  - id: "verify-project-class-in-generated-root"
    action: "wait 2 seconds"
    verifyFile:
      path: "~/target/generated-sources/demo/ProjectCreatedClass.java"
      exists: true
      contains: "public class ProjectCreatedClass"
    verifyEditorTab:
      title: "ProjectCreatedClass.java"
    timeout: 20

  - id: "verify-no-class-at-project-root"
    action: "wait 1 seconds"
    verifyFile:
      path: "~/ProjectCreatedClass.java"
      exists: false

  - id: "save-before-project-package"
    action: "executeVSCodeCommand workbench.action.files.saveAll"

  - id: "close-editors-before-project-package"
    action: "executeVSCodeCommand workbench.action.closeAllEditors"

  - id: "collapse-workspace-before-project-package"
    action: "collapseWorkspaceRoot"

  - id: "collapse-tree-before-project-package"
    action: "executeVSCodeCommand workbench.actions.treeView.javaProjectExplorer.collapseAll"

  - id: "focus-tree-before-project-package"
    action: "executeVSCodeCommand javaProjectExplorer.focus"

  - id: "select-project-for-package"
    action: "click generated-sources-tree tree item"

  - id: "new-package-from-project"
    action: "clickTreeItemAction generated-sources-tree New..."

  - id: "select-project-package-type"
    action: "select Package option"

  - id: "enter-project-package-name"
    action: "fillQuickInput com.example.projectcreated"

  # verifyFile's existence check also supports directories; an empty package
  # must exist on disk even before the Java Projects view refreshes.
  - id: "verify-project-package-in-generated-root"
    action: "wait 2 seconds"
    verifyFile:
      path: "~/target/generated-sources/demo/com/example/projectcreated"
      exists: true
    timeout: 20

  - id: "verify-no-package-at-project-root"
    action: "wait 1 seconds"
    verifyFile:
      path: "~/com/example/projectcreated"
      exists: false
